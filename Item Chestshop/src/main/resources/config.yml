  # ============================================================
  # COPPER / OXIDATION
  # ============================================================
  #
  # Oxidation prefixes:
  #   ex_     = exposed
  #   wea_    = weathered
  #   ox_     = oxidized
  #
  # Waxed prefixes:
  #   w_      = waxed
  #   w_ex_   = waxed exposed
  #   w_wea_  = waxed weathered
  #   w_ox_   = waxed oxidized
  #
  # Copper item abbreviations:
  #   c_blk    = copper block
  #   ch_c     = chiseled copper
  #   c_gr     = copper grate
  #   cut_c    = cut copper
  #   cut_c_st = cut copper stairs
  #   cut_c_sl = cut copper slab
  #   c_bars   = copper bars
  #   c_door   = copper door
  #   c_td     = copper trapdoor
  #   c_bulb   = copper bulb
  #   c_chain  = copper chain
  #   c_lan    = copper lantern
  #   c_chest  = copper chest
  #   cgs      = copper golem statue
  #
  # Examples:
  #   ox_c_blk     = oxidized copper block
  #   w_ex_c_door  = waxed exposed copper door
  #   w_ox_cgs     = waxed oxidized copper golem statue


